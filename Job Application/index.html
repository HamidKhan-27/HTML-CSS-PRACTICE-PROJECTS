<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Appliction</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="apply-box">
        <h1>Job Application <span class="tittle-small">(web)</span></h1>
        <form action="">
          <div class="form-container">
            <div class="form-control">
              <label for="first-name">First Name</label>
              <input
                type="text"
                id="first-name"
                placeholder="enter your first name"
              />
            </div>
            <div class="form-control">
              <label for="last-name">Last Name</label>
              <input
                type="text"
                id="last-name"
                placeholder="enter your last name"
              />
            </div>
            <div class="form-control">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="enter your email" />
            </div>
            <div class="form-control">
              <label for="job-role">Job Role</label>
              <select name="job-role" id="job-role">
                <option value="">Select Job Role</option>
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="full-stak">Full Stak Developer</option>
                <option value="ui-ux">UI UX Designer</option>
              </select>
            </div>
            <div class="textarea-control">
              <label for="address">Address</label>
              <textarea
                name="address"
                id="address"
                rows="4"
                cols="50"
                placeholder="enter your address"
              ></textarea>
            </div>
            <div class="form-control">
              <label for="city">City</label>
              <input
                type="text"
                id="city"
                name="city"
                placeholder="enter your city"
              />
            </div>
            <div class="form-control">
              <label for="pincode">Pincode</label>
              <input
                type="number"
                id="pincode"
                name="pincode"
                placeholder="enter your pincode"
              />
            </div>
            <div class="form-control">
              <label for="date">Date</label>
              <input value="2026-04-21" type="date" id="date" name="date" />
            </div>
            <div class="form-control">
              <label for="upload">Upload Your CV</label>
              <input type="file" id="upload" name="upload" />
            </div>
          </div>
          <div class="button-container">
            <button type="submit">Apply Now</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
